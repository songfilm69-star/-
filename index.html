
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="부부 합산 최대 100만원 결혼세액공제 예상금액을 계산해 보세요.">
<title>결혼세액공제 예상금액 계산기</title>

<style>
* {
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
    color: #222;
}
.container {
    max-width: 550px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 20px #00000010;
}
h1 {
    font-size: 24px;
    text-align: center;
}
.subtitle {
    text-align: center;
    color: #666;
    line-height: 1.6;
}
label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
}
input[type="number"] {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 18px;
}
.check {
    font-size: 14px;
    font-weight: normal;
    margin-top: 10px;
}
button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
}
.calculate {
    background: #03c75a;
    color: white;
    font-weight: bold;
}
.reset {
    background: #eeeeee;
    color: #333;
}
.result {
    background: #eafaf1;
    border-radius: 12px;
    padding: 20px;
    margin-top: 25px;
    text-align: center;
}
.amount {
    font-size: 32px;
    font-weight: bold;
    color: #008a40;
}
.notice {
    font-size: 13px;
    color: #777;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="container">

<h1>💍 결혼세액공제 계산기</h1>

<p class="subtitle">
2024~2026년 혼인신고자 대상<br>
부부 합산 최대 100만원 세액공제
</p>

<form id="calculator">

<label for="tax1">배우자 1 공제 가능 소득세 (원)</label>
<input type="number" id="tax1"
placeholder="예: 800000" min="0" step="1" required>

<label class="check">
<input type="checkbox" id="eligible1" checked>
결혼세액공제 대상자입니다.
</label>

<label for="tax2">배우자 2 공제 가능 소득세 (원)</label>
<input type="number" id="tax2"
placeholder="예: 300000" min="0" step="1" required>

<label class="check">
<input type="checkbox" id="eligible2" checked>
결혼세액공제 대상자입니다.
</label>

<button type="submit" class="calculate">
예상 공제금액 계산하기
</button>

<div class="result" aria-live="polite">

<p>부부 합산 예상 절세금액</p>

<div class="amount" id="total">0원</div>

<hr>

<p>배우자 1 : <span id="result1">0원</span></p>

<p>배우자 2 : <span id="result2">0원</span></p>

</div>

<button type="reset" class="reset">
다시 계산하기
</button>

</form>

<p class="notice">
※ 다른 공제를 적용한 후 남은 공제 가능
소득세를 입력하세요.<br>
※ 소득세가 없다면 0을 입력하세요.<br>
※ 개인별 최대 50만원까지 계산됩니다.<br>
※ 실제 연말정산 환급금과 다를 수 있습니다.<br>
※ 2026년 11월 기준 단순 예상 계산입니다.<br>
※ 입력한 금액은 외부 서버로 전송되지 않습니다.
</p>

</div>

<script>
function formatMoney(amount) {
    return amount.toLocaleString("ko-KR") + "원";
}

document.getElementById("calculator")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const tax1 = Math.max(0,
        Number(document.getElementById("tax1").value));

    const tax2 = Math.max(0,
        Number(document.getElementById("tax2").value));

    const eligible1 =
        document.getElementById("eligible1").checked;

    const eligible2 =
        document.getElementById("eligible2").checked;

    const result1 = eligible1
        ? Math.min(tax1, 500000) : 0;

    const result2 = eligible2
        ? Math.min(tax2, 500000) : 0;

    document.getElementById("result1").textContent =
        formatMoney(result1);

    document.getElementById("result2").textContent =
        formatMoney(result2);

    document.getElementById("total").textContent =
        formatMoney(result1 + result2);
});

document.getElementById("calculator")
.addEventListener("reset", function() {

    document.getElementById("total").textContent = "0원";
    document.getElementById("result1").textContent = "0원";
    document.getElementById("result2").textContent = "0원";
});
</script>

</body>
</html>
